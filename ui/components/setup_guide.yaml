title: "Detailed guide"
content: "## The 24-hour window\n\nWhen someone writes to your number a 24-hour window opens and resets with every new message from them. Inside it you may send any message type. Outside it WhatsApp refuses free-form messages (error 131047) and only an approved **template** goes through. You may message only people who opted in.\n\n## Incoming messages and webhook\n\nWhatsApp has no polling: messages arrive only by webhook, so the callback URL must be reachable from the internet over HTTPS. A local installation cannot receive messages. Meta checks the URL with the verify token and then signs every delivery with the app secret; Flow Steward rejects anything that does not verify. Meta retries failed deliveries for days; duplicates are ignored.\n\n## Who may start workflows\n\nA message starts a workflow only when the sender is a saved contact with **Workflow trigger** switched on. Everyone else is only listed under discovered senders.\n\n## What is not supported\n\nEditing, deleting or pinning sent messages (WhatsApp has none), groups, approvals through buttons, and template header or button parameters.\n\n## Permissions and token revocation\n\nThe system user token needs the whatsapp_business_messaging permission. If it may have leaked, revoke it in Meta Business Settings, generate a new one and save it. An empty field never overwrites the stored token."
