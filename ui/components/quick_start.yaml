component_id: quick_start
type: markdown
title: Checklist
content: "1. In [Meta for Developers](https://developers.facebook.com/) create an app with the **WhatsApp** product and note the **Phone number ID** (WhatsApp > API setup).\n2. In Meta Business Settings create a **system user**, give it the app and the `whatsapp_business_messaging` permission, and generate an **access token**. Paste it into the card above.\n3. Copy the app's **App secret** (App settings > Basic) into the same card. It is needed only for incoming messages.\n4. Save the phone number ID, then press **Verify**.\n5. For incoming messages: copy the **callback URL** and the **verify token** shown in the webhook card into the Meta dashboard (WhatsApp > Configuration > Webhook), then subscribe to the **messages** field. Meta must be able to reach the URL over public HTTPS.\n6. Open **Contacts** and add the people this number may write to. Contacts that wrote to you appear there automatically.\n\nMeta's guide: [WhatsApp Business Cloud API](https://developers.facebook.com/documentation/business-messaging/whatsapp)."
