component_id: secrets_form
anchor_id: secrets_form
type: form
title: "Access token and app secret"
description: "Required: the access token. The app secret is needed only for incoming messages. Both are treated like passwords, encrypted at rest, and never displayed after save."
schema_ref: "../../schemas/secrets.schema.yaml"
ui_schema:
  version: "1"
  type: form_ui
  layout:
    columns: 1
  sections:
    - section_id: secrets
      title: "Access token and app secret"
      variant: card
      field_ids:
        - access_token
        - app_secret
  fields:
    - field_id: access_token
      path: access_token
      widget: secret
      label: "Access token"
      placeholder: EAAG...
      help: "System user access token with the whatsapp_business_messaging permission. Encrypted at rest and never displayed after save. Leave the field empty to keep the stored token; enter a new one to replace it."
      section_id: secrets
    - field_id: app_secret
      path: app_secret
      widget: secret
      label: "App secret"
      help: "The Meta app's secret. Needed only for incoming messages: Flow Steward uses it to check that each webhook really comes from Meta. Leave empty to keep the stored value."
      section_id: secrets
  actions:
    save_label: "Save secrets"
    verify:
      action_id: verify_connection
      label: Verify
data:
  load_query: get_secrets
  save_action: save_secrets
  save_mode: patch
