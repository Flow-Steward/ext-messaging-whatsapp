queries:
  - query_id: provider_health
    title: "Provider Health"
    description: "Check the access token, phone number and readiness of this connection."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: extension
      config:
        runtime_resources:
          project_connection: true
          provider_key: flowsteward.whatsapp
          provider_secrets:
            - access_token
            - app_secret
          callback_registrations: true
          notification_deliveries: true
    result_fields:
      - summary.provider
      - summary.project_id
      - summary.status
      - checks
      - summary.readiness
      - summary.display_phone_number
    error_codes:
      - project_context_required
  - query_id: delivery_summary
    title: "Delivery Summary"
    description: "Aggregate delivery statistics (total, delivered, failed)."
    required_scopes:
      - "read:events"
    handler:
      mode: extension
      config:
        runtime_resources:
          notification_deliveries: true
    result_fields:
      - items
      - summary.provider
      - summary.total
    error_codes:
      - project_context_required
  - query_id: list_deliveries
    title: "List Deliveries"
    description: "Paginated delivery history for this provider."
    required_scopes:
      - "read:events"
    handler:
      mode: extension
      config:
        runtime_resources:
          notification_deliveries: true
    result_fields:
      - items
      - total
      - summary.project_id
    error_codes:
      - project_context_required
  - query_id: list_routes
    title: "List Routes"
    description: "Notification routes configured for this provider."
    required_scopes:
      - "read:events"
    handler:
      mode: extension
      config:
        runtime_resources:
          notification_routes: true
    result_fields:
      - items
      - summary.provider
      - summary.project_id
    error_codes:
      - project_context_required
  - query_id: get_config
    title: "Get Configuration"
    description: "Load persisted non-secret WhatsApp configuration for the selected project."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: extension
      config:
        runtime_resources:
          project_connection: true
    result_fields:
      - values.phone_number_id
      - values.waba_id
      - values.graph_api_version
      - summary.project_id
    error_codes:
      - project_context_required
  - query_id: get_secrets
    title: "Get Secrets"
    description: "Load which secrets are saved for the selected project; values are never returned."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: extension
      config:
        runtime_resources:
          project_connection: true
          provider_key: flowsteward.whatsapp
          provider_secrets:
            - access_token
            - app_secret
    result_fields:
      - values.access_token
      - values.app_secret
      - summary.project_id
      - summary.access_token_configured
      - summary.app_secret_configured
    error_codes:
      - project_context_required
  - query_id: list_contacts
    title: "List Contacts"
    description: "Load project-scoped WhatsApp contacts for the selected project."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: extension
      config:
        runtime_resources:
          project_connection: true
    result_fields:
      - values.contacts
      - items
      - summary.project_id
    error_codes:
      - project_context_required
  - query_id: get_inbound_status
    title: "Get Inbound Status"
    description: "Load callback registration and the last inbound webhook time."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: extension
      config:
        runtime_resources:
          project_connection: true
          provider_key: flowsteward.whatsapp
          provider_secrets:
            - app_secret
          callback_registrations: true
    result_fields:
      - items
      - summary.registered
      - summary.last_inbound_at
    error_codes:
      - project_context_required
  - query_id: list_discovered_senders
    title: "List Discovered Senders"
    description: "Load senders that wrote to this number and can be saved as contacts."
    required_scopes:
      - "extension:invoke"
    handler:
      mode: extension
      config:
        runtime_resources:
          project_connection: true
    result_fields:
      - values.discovered_senders
      - items
      - summary.project_id
    error_codes:
      - project_context_required
