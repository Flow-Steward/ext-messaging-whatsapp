manifest_version: 2
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: flowsteward.whatsapp
kind: notification_provider
version: 0.1.0
display_name: WhatsApp
description: Sends WhatsApp messages, templates, reactions and files through the WhatsApp Business Cloud API
  and starts workflows from incoming messages and delivery statuses.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-messaging-whatsapp/issues
  website_url: https://github.com/Flow-Steward/ext-messaging-whatsapp
listing:
  category: messaging
  tags:
  - whatsapp
  - notifications
  - messaging
  summary: Send WhatsApp messages and start workflows from incoming WhatsApp messages.
features:
- notify
- action
- ingress_event
event_subscriptions:
- {event_type: job.failed, severity: any, conditions: {}}
- {event_type: job.completed, severity: any, conditions: {}}
- {event_type: notification.delivery.failed, severity: any, conditions: {}}
- {event_type: external.comment.received, severity: any, conditions: {}}
- {event_type: whatsapp.message.received, severity: any, conditions: {}}
- {event_type: whatsapp.message.status, severity: any, conditions: {}}
workflow_triggers:
- trigger_type_id: message_received
  provider_key: flowsteward.whatsapp
  display_name: New WhatsApp message
  description: Starts the workflow when a contact that is enabled for workflow triggers on the
    Contacts page sends a message to this WhatsApp number. The workflow receives the message
    metadata and, for a file, its media ID; the file itself is not downloaded.
  event_name: whatsapp.message.received
  config_schema:
    type: object
    additionalProperties: false
    properties:
      wa_id:
        type: string
        title: Sender phone number
      message_type:
        type: string
        title: Message type
        enum: [text, image, video, document, audio, interactive, location, reaction]
      has_file:
        type: boolean
        title: Has a file
  ui_schema:
    fields:
    - name: wa_id
      label: Sender phone number
      widget_type: text
      required: false
      placeholder: '37060000000'
      help_text: Start only for messages from this number (digits only). Leave empty to accept every contact that is allowed to trigger workflows.
    - name: message_type
      label: Message type
      widget_type: select
      required: false
      help_text: Start only for this kind of message. Leave empty for every kind.
      options:
      - {label: Text, value: text}
      - {label: Image, value: image}
      - {label: Video, value: video}
      - {label: Document, value: document}
      - {label: Audio, value: audio}
      - {label: Button or list reply, value: interactive}
      - {label: Location, value: location}
      - {label: Reaction, value: reaction}
    - name: has_file
      label: Has a file
      widget_type: boolean
      required: false
      help_text: Start only for messages that carry a file (image, video, document or audio).
- trigger_type_id: message_status
  provider_key: flowsteward.whatsapp
  display_name: WhatsApp message status
  description: Starts the workflow when WhatsApp reports that a message you sent was sent,
    delivered, read or failed.
  event_name: whatsapp.message.status
  config_schema:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        title: Status
        enum: [sent, delivered, read, failed]
      wa_id:
        type: string
        title: Recipient phone number
  ui_schema:
    fields:
    - name: status
      label: Status
      widget_type: select
      required: false
      help_text: Start only for this status. Leave empty for every status.
      options:
      - {label: Sent, value: sent}
      - {label: Delivered, value: delivered}
      - {label: Read, value: read}
      - {label: Failed, value: failed}
    - name: wa_id
      label: Recipient phone number
      widget_type: text
      required: false
      placeholder: '37060000000'
      help_text: Start only for messages sent to this number (digits only).
required_scopes:
- event:subscribe
- notify:dispatch
- extension:invoke
- read:events
- artifact:read
- artifact:write
schemas:
  config: schemas/config.schema.yaml
  secrets: schemas/secrets.schema.yaml
  subscriptions: schemas/subscriptions.schema.yaml
  input:
    type: object
    properties:
      action:
        type: string
      event:
        type: object
      route:
        type: object
      request:
        type: object
    required:
    - action
  output:
    type: object
    properties:
      ok:
        type: boolean
      delivered:
        type: boolean
      provider_message_id:
        type: string
    required:
    - ok
    - delivered
machine_auth:
  service_account_key: svc_ext_whatsapp
  required_scopes:
  - event:subscribe
  - notify:dispatch
  - artifact:read
  - artifact:write
account_scope:
  scope_type: project
  description: WhatsApp binding is per-project; each project configures its phone number ID,
    access token and named contacts.
# Where the extension connects: the Graph API, and the Meta host a media download URL points to.
egress:
  hosts:
  - graph.facebook.com
  - lookaside.fbsbx.com
external_effects:
- operation_id: send_message
  effect_kind: message_delivery
  channel: whatsapp
  idempotency: required
  test_mode_behavior: suppress
  observability:
    target_fields:
    - channel_id
    target_kind: channel
    target_label: WhatsApp contact
  rate_limit:
    window_seconds: 60
    account_max: 60
    project_max: 30
    connection_max: 20
- operation_id: send_template
  effect_kind: message_delivery
  channel: whatsapp
  idempotency: required
  test_mode_behavior: suppress
  observability:
    target_fields:
    - channel_id
    target_kind: channel
    target_label: WhatsApp contact
  rate_limit:
    window_seconds: 60
    account_max: 60
    project_max: 30
    connection_max: 20
- operation_id: send_reaction
  effect_kind: message_delivery
  channel: whatsapp
  idempotency: required
  test_mode_behavior: suppress
  observability:
    target_fields:
    - channel_id
    target_kind: channel
    target_label: WhatsApp contact
  rate_limit:
    window_seconds: 60
    account_max: 60
    project_max: 30
    connection_max: 20
- operation_id: send_file
  effect_kind: message_delivery
  channel: whatsapp
  idempotency: required
  test_mode_behavior: suppress
  observability:
    target_fields:
    - channel_id
    target_kind: channel
    target_label: WhatsApp contact
  rate_limit:
    window_seconds: 60
    account_max: 60
    project_max: 30
    connection_max: 20
- operation_id: mark_as_read
  effect_kind: message_delivery
  channel: whatsapp
  idempotency: required
  test_mode_behavior: suppress
  observability:
    target_fields:
    - message_id
    target_kind: channel
    target_label: WhatsApp message
  rate_limit:
    window_seconds: 60
    account_max: 60
    project_max: 30
    connection_max: 20
- operation_id: deliver_notification
  effect_kind: message_delivery
  channel: whatsapp
  idempotency: required
  test_mode_behavior: suppress
  observability:
    target_fields:
    - channel_id
    target_kind: channel
    target_label: WhatsApp contact
callbacks:
- callback_id: updates
  purpose: inbound_events
  methods:
  - GET
  - POST
  action_id: ingress_event
  connection_scoped: true
  auth:
    type: hub_signature
    signature_header: X-Hub-Signature-256
    secret_name: app_secret
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
artifact_policies:
- operation_id: send_file
  inputs:
  - kind: artifact
    value_type: artifact_handle
    binding_key: source_artifact
    field: artifact_handle
    required: true
    max_size_bytes: 104857600
- operation_id: get_file
  outputs:
  - kind: artifact
    binding_key: downloaded_file
    filename: whatsapp_file.bin
    content_type: application/octet-stream
    max_size_bytes: 104857600
    retention_class: run_window
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
query_manifest: ui/queries/queries.yaml
action_manifest: ui/actions/actions.yaml
# Rights over this extension's own data. Flow Steward grants them to any
# extension that declares them, limited to its own connections and to its
# own id as provider key.
runtime_grants:
  resources:
    project_connection: {scope: owning_extension}
    provider_secrets: {secret_keys: [access_token, app_secret]}
    notification_deliveries: {}
    notification_routes: {}
    callback_registrations: {scope: owning_extension}
  mutations:
    project_connection_upsert: {scope: owning_extension}
    project_connection_secrets_save:
      scope: owning_extension
      secret_keys: [access_token, app_secret]
      connection_type_ids: [whatsapp_cloud]
    notification_delivery_log: {}
    notification_routes_save: {}
