  - operation_id: mark_as_read
    display_name: "Mark WhatsApp message as read"
    description: "Mark a received message as read (the sender sees blue ticks). Works within 30 days of receipt; it also marks earlier messages of the chat as read."
    operation_kind: action
    category: notification
    connection_type_ids:
      - whatsapp_cloud
    workflow_visible: true
    inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
      - name: message_id
        value_type: text
        required: true
        display_name: "Message ID"
        description: "The ID (wamid) of the received message, for example message_id of a New WhatsApp message trigger."
    outputs:
      - name: marked_read
        value_type: boolean
        display_name: "Marked as read"
        description: "Whether WhatsApp confirmed the read mark."
      - name: message_id
        value_type: text
        display_name: "Message ID"
        description: "The message that was marked."
      - name: external_effect_status
        value_type: text
    result_fields:
      - result.marked_read
      - result.message_id
    error_codes:
      - message_id_required
      - project_connection_required
      - access_token_required
      - phone_number_id_required
      - whatsapp_window_closed
      - whatsapp_parameter_invalid
      - whatsapp_parameter_missing
      - whatsapp_media_rejected
      - whatsapp_token_invalid
      - whatsapp_rate_limited
      - whatsapp_undeliverable
      - whatsapp_recipient_is_sender
