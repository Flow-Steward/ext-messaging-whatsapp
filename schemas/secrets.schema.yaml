$schema: https://json-schema.org/draft/2020-12/schema
title: WhatsApp Secrets
description: Secret values resolved via provider_runtime secret resolution. Stored
  in provider_secrets, never in config.
type: object
properties:
  access_token:
    type: string
    description: System user access token with the whatsapp_business_messaging permission.
  app_secret:
    type: string
    description: App secret of the Meta app; Core uses it to verify the signature of inbound webhooks.
required:
- access_token
additionalProperties: false
