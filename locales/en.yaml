component.whatsapp_overview.title: About
component.whatsapp_overview.content: "Sends project messages to WhatsApp through the WhatsApp Business Cloud API: text, templates, reactions and files, and notifications for job failures and completions. Incoming messages from contacts you allow can start workflows. Each project binds its own phone number, access token and named contacts.\n\nWhatsApp only allows free-form messages within 24 hours after the person last wrote to you; outside that window use a template. Start on **Setup**, then **Contacts**."
component.secrets_form.title: "Access token and app secret"
component.secrets_form.description: "Required: the access token. The app secret is needed only for incoming messages. Both are treated like passwords, encrypted at rest, and never displayed after save."
component.secrets_form.field.access_token.label: "Access token"
component.secrets_form.field.access_token.help: "System user access token with the whatsapp_business_messaging permission. Encrypted at rest and never displayed after save. Leave the field empty to keep the stored token; enter a new one to replace it."
component.secrets_form.field.access_token.placeholder: EAAG...
component.secrets_form.field.app_secret.label: "App secret"
component.secrets_form.field.app_secret.help: "The Meta app's secret. Needed only for incoming messages: Flow Steward uses it to check that each webhook really comes from Meta. Leave empty to keep the stored value."
