component.whatsapp_webhook_setup.title: "Incoming messages (webhook)"
component.quick_start.title: Checklist
component.quick_start.content: "1. In [Meta for Developers](https://developers.facebook.com/) create an app with the **WhatsApp** product and note the **Phone number ID** (WhatsApp > API setup).\n2. In Meta Business Settings create a **system user**, give it the app and the `whatsapp_business_messaging` permission, and generate an **access token**. Paste it into the card above.\n3. Copy the app's **App secret** (App settings > Basic) into the same card. It is needed only for incoming messages.\n4. Save the phone number ID, then press **Verify**.\n5. For incoming messages: copy the **callback URL** and the **verify token** shown in the webhook card into the Meta dashboard (WhatsApp > Configuration > Webhook), then subscribe to the **messages** field. Meta must be able to reach the URL over public HTTPS.\n6. Open **Contacts** and add the people this number may write to. Contacts that wrote to you appear there automatically.\n\nMeta's guide: [WhatsApp Business Cloud API](https://developers.facebook.com/documentation/business-messaging/whatsapp)."
component.setup_guide.title: "Detailed guide"
component.setup_guide.content: "## The 24-hour window\n\nWhen someone writes to your number a 24-hour window opens and resets with every new message from them. Inside it you may send any message type. Outside it WhatsApp refuses free-form messages (error 131047) and only an approved **template** goes through. You may message only people who opted in.\n\n## Incoming messages and webhook\n\nWhatsApp has no polling: messages arrive only by webhook, so the callback URL must be reachable from the internet over HTTPS. A local installation cannot receive messages. Meta checks the URL with the verify token and then signs every delivery with the app secret; Flow Steward rejects anything that does not verify. Meta retries failed deliveries for days; duplicates are ignored.\n\n## Who may start workflows\n\nA message starts a workflow only when the sender is a saved contact with **Workflow trigger** switched on. Everyone else is only listed under discovered senders.\n\n## What is not supported\n\nEditing, deleting or pinning sent messages (WhatsApp has none), groups, approvals through buttons, and template header or button parameters.\n\n## Permissions and token revocation\n\nThe system user token needs the whatsapp_business_messaging permission. If it may have leaked, revoke it in Meta Business Settings, generate a new one and save it. An empty field never overwrites the stored token."
component.contacts_intro.title: Contacts
component.contacts_intro.content: "A **contact** is one person (a phone number, digits only with the country code, for example `37060000000`) saved as a stable, named Flow Steward destination. **Notify** lets Flow Steward write to the contact. **Workflow trigger** lets the contact's incoming messages start workflows; it is off by default.\n\nEveryone who writes to this number shows up under **Discovered senders**; save one to turn it into a contact. Groups are not supported."
